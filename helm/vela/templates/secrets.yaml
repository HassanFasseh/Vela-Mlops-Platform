apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  DATABASE_URL: {{ include "vela.databaseUrl" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_ENDPOINT: {{ .Values.minio.endpoint | quote }}
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: groq-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: Opaque
stringData:
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gemini-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: Opaque
stringData:
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: github-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  GITHUB_REPO: {{ .Values.secrets.githubRepo | quote }}
{{- if .Values.registry.createPullSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.pullSecretName }}
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |-
    {{ printf `{"auths":{"%s":{"username":"%s","password":"%s","email":"%s","auth":"%s"}}}` .Values.registry.server .Values.registry.ghcr.username .Values.registry.ghcr.password .Values.registry.ghcr.email (printf "%s:%s" .Values.registry.ghcr.username .Values.registry.ghcr.password | b64enc) }}
{{- end }}
