{{/*
Guard against a self-contradictory secrets.backend/*.enabled combination.
Without this, e.g. secrets.backend=vault with secrets.vault.enabled=false
would silently render backend-app with env vars pointing at Secrets that
don't exist below (this file renders none of them for a non-"kubernetes"
backend, regardless of the *.enabled flags) — a CreateContainerConfigError
at pod scheduling time instead of a clear error at `helm install` time.
*/}}
{{- if and (eq .Values.secrets.backend "vault") (not .Values.secrets.vault.enabled) }}
{{ fail "secrets.backend is \"vault\" but secrets.vault.enabled is false — set secrets.vault.enabled=true, or set secrets.backend back to \"kubernetes\"." }}
{{- end }}
{{- if and (eq .Values.secrets.backend "external-secrets") (not .Values.secrets.externalSecrets.enabled) }}
{{ fail "secrets.backend is \"external-secrets\" but secrets.externalSecrets.enabled is false — set secrets.externalSecrets.enabled=true, or set secrets.backend back to \"kubernetes\"." }}
{{- end }}
{{- if and (ne .Values.secrets.backend "kubernetes") (ne .Values.secrets.backend "vault") (ne .Values.secrets.backend "external-secrets") }}
{{ fail (printf "secrets.backend must be one of kubernetes|vault|external-secrets, got %q" .Values.secrets.backend) }}
{{- end }}

{{/*
Native Kubernetes Secret objects — only rendered when secrets.backend is
"kubernetes" (the default). In "vault" and "external-secrets" mode these are
replaced by, respectively, Vault Agent sidecar injection (see
vault-annotations.tpl, wired up in backend-deployment.yaml) and the
ExternalSecret resources in external-secrets.yaml.

Note: switching secrets.backend away from "kubernetes" removes ALL of the
Secret objects below, including postgres-secret/minio-secret (which
Postgres/MinIO's own containers need to bootstrap) and the ghcr-secret image
pull secret — external-secrets mode covers those via external-secrets.yaml,
but vault mode intentionally does not (see SECRET_MANAGEMENT.md for why and
what to do instead).

Independently, postgres-secret/minio-secret are also skipped whenever
production.externalDatabase/externalMinio.enabled is true, regardless of
secrets.backend — there's no in-cluster postgres/minio for them to
bootstrap in that mode (see PRODUCTION.md).
*/}}
{{- if eq .Values.secrets.backend "kubernetes" }}
{{- if not .Values.production.externalDatabase.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  DATABASE_URL: {{ include "vela.databaseUrl" . | quote }}
---
{{- end }}
{{- if not .Values.production.externalMinio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_ENDPOINT: {{ .Values.minio.endpoint | quote }}
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: groq-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: Opaque
stringData:
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gemini-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: Opaque
stringData:
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: github-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  GITHUB_REPO: {{ .Values.secrets.githubRepo | quote }}
{{- if .Values.registry.createPullSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.pullSecretName }}
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |-
    {{ printf `{"auths":{"%s":{"username":"%s","password":"%s","email":"%s","auth":"%s"}}}` .Values.registry.server .Values.registry.ghcr.username .Values.registry.ghcr.password .Values.registry.ghcr.email (printf "%s:%s" .Values.registry.ghcr.username .Values.registry.ghcr.password | b64enc) }}
{{- end }}
{{- end }}
