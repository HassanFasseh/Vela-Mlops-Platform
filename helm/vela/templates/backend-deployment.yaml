apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: {{ include "vela.namespace" . }}
  labels:
    app: backend-app
    {{- include "vela.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
      {{- if and (eq .Values.secrets.backend "vault") .Values.secrets.vault.enabled }}
      annotations:
        {{- include "vela.vaultAnnotations" . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.rbac.serviceAccountName }}
      imagePullSecrets:
        - name: {{ .Values.registry.pullSecretName }}
      containers:
        - name: backend-app
          image: {{ include "vela.image" (dict "root" $ "repository" .Values.backend.image.repository "tag" .Values.backend.image.tag) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          {{- if and (eq .Values.secrets.backend "vault") .Values.secrets.vault.enabled }}
          # Vault Agent (injected via the annotations above) writes rendered
          # secrets to /vault/secrets/config before this container starts;
          # source it into the shell environment, then hand off to the same
          # command Dockerfile.backend's own CMD runs.
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /vault/secrets/config ]; then . /vault/secrets/config; fi
              exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
          {{- else }}
          # Works whether the Secrets below were rendered natively
          # (secrets.backend: kubernetes) or synced in by the External
          # Secrets Operator (secrets.backend: external-secrets) — both
          # produce Secret objects under these same names/keys.
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-secret
                  key: GROQ_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: GEMINI_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ENDPOINT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-secret
                  key: GITHUB_TOKEN
            - name: GITHUB_REPO
              valueFrom:
                secretKeyRef:
                  name: github-secret
                  key: GITHUB_REPO
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
