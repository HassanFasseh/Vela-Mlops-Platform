{{- if and (eq .Values.secrets.backend "external-secrets") .Values.secrets.externalSecrets.enabled }}
{{/*
One ExternalSecret per Kubernetes Secret the "kubernetes" backend would
otherwise render natively (see secrets.yaml). The External Secrets Operator
(ESO) reconciles each into a real Secret with the SAME name and keys as the
native version — so backend-app/postgres/minio's env `secretKeyRef`s work
unchanged no matter which backend produced the Secret they point at.

Non-secret values (DB name/user, MinIO endpoint/user, the GitHub repo, the
GHCR username/server) are baked in directly from values.yaml via Helm — only
the fields actually listed under secrets.externalSecrets.remoteRefs are
fetched from the external store.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: groq-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: groq-secret
    creationPolicy: Owner
  data:
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.groqApiKey }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gemini-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: gemini-secret
    creationPolicy: Owner
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.geminiApiKey }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: github-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # GITHUB_REPO isn't secret — baked in literally by Helm. GITHUB_TOKEN
        # references the fetched value using ESO's own template syntax (see
        # `data[].secretKey: token` below) — left as literal text below for ESO
        # to fill in at reconcile time, hence the backtick raw string.
        GITHUB_TOKEN: "{{ `{{ .token }}` }}"
        GITHUB_REPO: {{ .Values.secrets.githubRepo | quote }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.githubToken }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: postgres-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        POSTGRES_DB: {{ .Values.database.name | quote }}
        POSTGRES_USER: {{ .Values.database.user | quote }}
        POSTGRES_PASSWORD: "{{ `{{ .password }}` }}"
        DATABASE_URL: "postgresql://{{ .Values.database.user }}:{{ `{{ .password }}` }}@postgres:5432/{{ .Values.database.name }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.databasePassword }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-secret
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: minio-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        MINIO_ENDPOINT: {{ .Values.minio.endpoint | quote }}
        MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
        MINIO_ROOT_PASSWORD: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.minioRootPassword }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.registry.pullSecretName }}
  namespace: {{ include "vela.namespace" . }}
  labels:
    {{- include "vela.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.registry.pullSecretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # No "auth" field — Kubernetes falls back to username+password when it's
        # absent, which sidesteps needing ESO to base64-encode the username and
        # fetched token itself (its template engine can, via Sprig's b64enc, but
        # composing that through two layers of template escaping isn't worth the
        # fragility here).
        .dockerconfigjson: |-
          {{ printf `{"auths":{"%s":{"username":"%s","password":"{{ .token }}","email":"%s"}}}` .Values.registry.server .Values.registry.ghcr.username .Values.registry.ghcr.email }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.ghcrToken }}
{{- end }}
