# Default values for the Vela Helm chart.
# Override any of these with --set or -f my-values.yaml at install/upgrade time.

# -- Namespace resources are rendered into. Leave blank to use the release namespace
#    (i.e. whatever -n/--namespace you pass to `helm install`).
namespaceOverride: ""

# -----------------------------------------------------------------------------
# Container registry (GHCR) — where the Vela images live and how to pull them
# -----------------------------------------------------------------------------
registry:
  server: ghcr.io
  # -- Repository path images are published under, e.g. ghcr.io/hassanfasseh/vela
  repository: ghcr.io/hassanfasseh/vela
  # -- Set true to create the `ghcr-secret` imagePullSecret from ghcr.username/ghcr.password below.
  #    Set false if the secret already exists in the cluster (e.g. created imperatively) and you
  #    just want the deployments to reference it.
  createPullSecret: true
  pullSecretName: ghcr-secret
  ghcr:
    username: ""
    # -- GitHub Personal Access Token with read:packages scope. Rotate and re-run
    #    `helm upgrade` when it expires (PATs expire ~90 days).
    password: ""
    email: "noreply@example.com"

# -----------------------------------------------------------------------------
# backend-app
# -----------------------------------------------------------------------------
backend:
  replicaCount: 1
  image:
    repository: backend-app
    tag: latest-fix
    pullPolicy: IfNotPresent
  # -- Image k8s_custom.py's create_runtime_deployment() hands new custom
  #    model deployments (CUSTOM_RUNNER_IMAGE env var below). .github/
  #    workflows/build-base-runner.yml patches this in place on the live
  #    Deployment (kubectl set env) after every successful base-image
  #    build, pointing it at that build's :base-<sha> tag instead of this
  #    floating :base default — a Helm upgrade/reinstall resets it back
  #    to this value, same as any other kubectl set env drift.
  customRunnerImage: ghcr.io/hassanfasseh/vela/custom-runner:base
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  # -- Separate LoadBalancer service exposing the backend externally (as run today on OCI).
  externalService:
    enabled: true
    type: LoadBalancer
    port: 80
    targetPort: 8000
    # -- Cloud-provider annotations, e.g. OCI load balancer subnet.
    annotations: {}
      # service.beta.kubernetes.io/oci-load-balancer-subnet1: "ocid1.subnet.oc1...."
  resources:
    requests:
      memory: 256Mi
      cpu: 80m
    limits:
      memory: 512Mi
      cpu: 300m

# -----------------------------------------------------------------------------
# model-service
# -----------------------------------------------------------------------------
modelService:
  replicaCount: 1
  image:
    repository: model-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
    targetPort: 8000
    annotations: {}
      # service.beta.kubernetes.io/oci-load-balancer-subnet1: "ocid1.subnet.oc1...."
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m
  # -- Enable a Prometheus Operator ServiceMonitor scraping /metrics on this service.
  #    Requires the Prometheus Operator CRDs to be installed in the cluster.
  serviceMonitor:
    enabled: false
    namespace: monitoring
    labels:
      release: monitoring
    interval: 15s
    path: /metrics

# -----------------------------------------------------------------------------
# PostgreSQL
# -----------------------------------------------------------------------------
database:
  image:
    repository: docker.io/postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  name: vela
  user: vela
  # -- Required. Pass with --set database.password=... at install time.
  password: ""
  # -- Full DATABASE_URL override. Leave blank to have it derived from
  #    name/user/password/host/port in _helpers.tpl.
  urlOverride: ""
  storageSize: 5Gi
  storageClassName: ""
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 300m

# -----------------------------------------------------------------------------
# MinIO
# -----------------------------------------------------------------------------
minio:
  image:
    repository: docker.io/minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  rootUser: minioadmin
  # -- Required. Pass with --set minio.rootPassword=... at install time.
  rootPassword: ""
  endpoint: "minio:9000"
  storageSize: 10Gi
  storageClassName: ""
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 300m

# -----------------------------------------------------------------------------
# Redis
# -----------------------------------------------------------------------------
redis:
  image:
    repository: docker.io/redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# -----------------------------------------------------------------------------
# Secrets — LLM API keys, GitHub integration, and how they're all sourced
# -----------------------------------------------------------------------------
secrets:
  # -- Groq API key, used for LLM-generated drift explanations.
  groqApiKey: ""
  # -- Gemini API key, fallback/alternate LLM provider for drift explanations.
  geminiApiKey: ""
  # -- GitHub token used to open drift issues / trigger Actions. Needs repo scope.
  githubToken: ""
  # -- GitHub repo the token operates against, e.g. HassanFasseh/vela
  githubRepo: ""

  # -- Where backend-app's application secrets (GROQ_API_KEY, GEMINI_API_KEY,
  #    DATABASE_URL, MinIO client creds, GITHUB_TOKEN/REPO) come from:
  #      kubernetes       — plain Secret objects rendered from the values above (default)
  #      vault            — injected at pod startup by the Vault Agent Injector
  #      external-secrets — synced from an external store by the External Secrets Operator
  #    See SECRET_MANAGEMENT.md — vault mode covers backend-app only, not Postgres/MinIO's
  #    own bootstrap credentials or the GHCR pull secret (those need a plain Secret
  #    regardless of this setting, since a pod's own image pull and a stateful
  #    container's first-boot env can't be solved by Vault's sidecar-injection model).
  #    external-secrets mode has no such gap: it covers all six secrets below.
  backend: kubernetes # kubernetes | vault | external-secrets

  vault:
    # -- Must be true (in addition to backend: vault above) for the Vault Agent
    #    annotations to actually be added — a deliberate double-flag so flipping
    #    `backend` alone can't silently change how secrets are injected.
    enabled: false
    # -- Vault server address, e.g. https://vault.company.internal:8200. Informational
    #    / for reference only unless you also set the per-pod override annotation this
    #    renders (vault.hashicorp.com/service) — most setups instead configure the
    #    address once on the Vault Agent Injector's own Helm release. See SECRET_MANAGEMENT.md.
    address: ""
    # -- Vault Kubernetes-auth role bound to backend-app's ServiceAccount
    #    (rbac.serviceAccountName) and a policy granting read on `path` below.
    role: vela-backend
    # -- KV v2 path holding backend-app's secrets — one Vault key per env var
    #    backend-app needs: GROQ_API_KEY, GEMINI_API_KEY, DATABASE_URL, MINIO_ENDPOINT,
    #    MINIO_ACCESS_KEY, MINIO_SECRET_KEY, GITHUB_TOKEN, GITHUB_REPO.
    path: secret/vela
    tlsSkipVerify: false

  externalSecrets:
    # -- Must be true (in addition to backend: external-secrets above) for the
    #    ExternalSecret resources to actually render.
    enabled: false
    refreshInterval: 1h
    secretStoreRef:
      name: cluster-secret-store
      kind: ClusterSecretStore
    # -- Key/path each secret lives under in your external store (AWS Secrets
    #    Manager, Azure Key Vault, GCP Secret Manager, ...) — whatever format your
    #    SecretStore's provider expects.
    remoteRefs:
      groqApiKey: vela/groq-api-key
      geminiApiKey: vela/gemini-api-key
      githubToken: vela/github-token
      databasePassword: vela/database-password
      minioRootPassword: vela/minio-root-password
      ghcrToken: vela/ghcr-token

# -----------------------------------------------------------------------------
# RBAC — permissions backend-app needs to manage model Deployments/Services/Jobs
# -----------------------------------------------------------------------------
rbac:
  create: true
  serviceAccountName: default

# -----------------------------------------------------------------------------
# Production / multi-node — see PRODUCTION.md for the full guide
# -----------------------------------------------------------------------------
production:
  multiNode:
    # -- Not itself read by any template's `if` — the granular flags below
    #    (podAntiAffinity/podDisruptionBudget/externalDatabase/externalMinio)
    #    each have their own independent enabled flag, since anti-affinity in
    #    "preferred" mode is harmless even on a single node and is on by
    #    default regardless of this. What this flag DOES gate: when true,
    #    backend/model-service render with `resources.requests == resources.limits`
    #    (Guaranteed QoS — see PRODUCTION.md's Resource limits section) instead
    #    of the requests/limits split in backend.resources/modelService.resources.
    #    Treat it as the one flag to flip first in a production-values.yaml,
    #    alongside setting the specific flags below to match.
    enabled: false

  podAntiAffinity:
    # -- Spread backend-app pods across nodes so a single node loss doesn't
    #    take out every replica. On by default in "preferred" mode, which is
    #    a no-op risk on a single-node cluster (it just can't be satisfied,
    #    pods still schedule) and real protection once you have >1 node.
    backend:
      enabled: true
      mode: preferred # preferred | required — required can leave pods Pending if replicaCount > available nodes
    modelService:
      enabled: true
      mode: preferred

  podDisruptionBudget:
    # -- Off by default: with the default replicaCount: 1, a PDB with
    #    minAvailable: 1 would block ALL voluntary evictions (node drains,
    #    cluster upgrades) since there'd be no spare replica to move first.
    #    Turn on together with replicaCount >= 2.
    backend:
      enabled: false
      minAvailable: 1
    modelService:
      enabled: false
      minAvailable: 1

  # -- In-cluster postgres/minio are single-replica — fine for the default
  #    single-node setup, a single point of failure once you're actually
  #    spreading everything else across multiple nodes. See PRODUCTION.md
  #    for why RWX volumes don't actually solve this (Postgres can't have
  #    multiple writers against shared storage regardless of access mode,
  #    and MinIO's real distributed/HA mode needs multiple per-node disks,
  #    not one shared volume) — an external managed service is the
  #    recommended production path instead.
  externalDatabase:
    # -- When true, the in-cluster postgres Deployment/PVC/Service (and its
    #    Secret, in "kubernetes"/"external-secrets" secrets.backend mode)
    #    stop rendering entirely, and backend-app's DATABASE_URL is built
    #    from host/port/name below plus the password in existingSecret.
    #    (Unrelated to the older database.urlOverride: that just replaces
    #    the DATABASE_URL value while still deploying in-cluster postgres —
    #    use this instead for an actual external database.)
    enabled: false
    host: "" # e.g. vela.xxxx.us-east-1.rds.amazonaws.com
    port: 5432
    name: aodp
    existingSecret: "" # name of a Secret with a POSTGRES_PASSWORD key, created out of band

  externalMinio:
    # -- When true, the in-cluster minio Deployment/PVC/Service (and its
    #    Secret, same conditions as externalDatabase above) stop rendering,
    #    and backend-app's MinIO client env vars come from endpoint below
    #    plus existingSecret.
    enabled: false
    endpoint: "" # e.g. s3.us-east-1.amazonaws.com, or your S3-compatible endpoint
    existingSecret: "" # name of a Secret with MINIO_ROOT_USER and MINIO_ROOT_PASSWORD keys, created out of band

  # -- Off by default — existing installs get no pod-spec change unless you
  #    opt in. backend-app has no dedicated health endpoint; "/" (the
  #    landing page) is used, which is a liveness signal (process is up and
  #    serving) rather than a true readiness check (it doesn't verify
  #    DB/MinIO connectivity). model-service does have a real /health
  #    endpoint that also reports Redis connectivity. See PRODUCTION.md.
  healthChecks:
    backend:
      enabled: false
      path: /
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    modelService:
      enabled: false
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3

  autoscaling:
    backend:
      # -- Set true when backend-app's replica count is managed by a
      #    HorizontalPodAutoscaler instead of backend.replicaCount — see
      #    PRODUCTION.md's Horizontal Pod Autoscaler section for the actual
      #    HPA manifest (this chart doesn't render one). The only thing this
      #    flag changes here: the Deployment stops setting `spec.replicas`
      #    at all, so `helm upgrade` doesn't fight the HPA by resetting the
      #    replica count back to backend.replicaCount on every release.
      enabled: false

# -----------------------------------------------------------------------------
# Ingress (optional — the reference deployment uses LoadBalancer services instead)
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: vela.example.com
  tls:
    enabled: false
    secretName: vela-tls
