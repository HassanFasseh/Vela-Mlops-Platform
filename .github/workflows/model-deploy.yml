name: Deploy User Model

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'HuggingFace model name (e.g. distilbert-base-uncased-finetuned-sst-2-english)'
        required: true
        type: string
      task_type:
        description: 'HuggingFace pipeline task type'
        required: true
        type: choice
        options:
          - sentiment-analysis
          - zero-shot-classification
          - text-classification
          - token-classification
          - text-generation
          - summarization
          - translation
          - question-answering
          - fill-mask
          - image-classification
      deployment_name:
        description: 'Kubernetes deployment name (lowercase, no spaces, e.g. my-model)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hassanfasseh/vela/model-runner
  NAMESPACE: default

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push model runner image
        uses: docker/build-push-action@v5
        with:
          context: ./model-runner
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.inputs.deployment_name }}
            ${{ env.IMAGE }}:${{ github.event.inputs.deployment_name }}-${{ github.sha }}
          build-args: |
            MODEL_NAME=${{ github.event.inputs.model_name }}
            TASK_TYPE=${{ github.event.inputs.task_type }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install OCI CLI
        run: |
          curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          bash install.sh --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << CFG
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          CFG

      - name: Get kubeconfig
        run: |
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ secrets.CLUSTER_OCID }} \
            --file "$HOME/.kube/config" \
            --region ${{ secrets.OCI_REGION }} \
            --token-version 2.0.0

      - name: Deploy to Kubernetes
        run: |
          cat <<MANIFEST | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ github.event.inputs.deployment_name }}
            namespace: ${{ env.NAMESPACE }}
            labels:
              app: ${{ github.event.inputs.deployment_name }}
              managed-by: platform
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ${{ github.event.inputs.deployment_name }}
            template:
              metadata:
                labels:
                  app: ${{ github.event.inputs.deployment_name }}
                  managed-by: platform
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/path: "/metrics"
                  prometheus.io/port: "8000"
              spec:
                imagePullSecrets:
                  - name: ghcr-secret
                containers:
                  - name: model-runner
                    image: ${{ env.IMAGE }}:${{ github.event.inputs.deployment_name }}-${{ github.sha }}
                    ports:
                      - name: http
                        containerPort: 8000
                    env:
                      - name: MODEL_NAME
                        value: "${{ github.event.inputs.model_name }}"
                      - name: TASK_TYPE
                        value: "${{ github.event.inputs.task_type }}"
                    resources:
                      requests:
                        memory: "512Mi"
                        cpu: "80m"
                      limits:
                        memory: "2Gi"
                        cpu: "500m"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${{ github.event.inputs.deployment_name }}
            namespace: ${{ env.NAMESPACE }}
            labels:
              app: ${{ github.event.inputs.deployment_name }}
              managed-by: platform
          spec:
            type: ClusterIP
            selector:
              app: ${{ github.event.inputs.deployment_name }}
            ports:
              - name: http
                port: 80
                targetPort: 8000
          MANIFEST

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ github.event.inputs.deployment_name }} \
            --namespace ${{ env.NAMESPACE }} --timeout=300s

      - name: Verify health
        run: |
          kubectl run health-check-${{ github.event.inputs.deployment_name }} \
            --image=docker.io/curlimages/curl:latest \
            --restart=Never \
            --namespace ${{ env.NAMESPACE }} \
            -- curl -s http://${{ github.event.inputs.deployment_name }}.${{ env.NAMESPACE }}.svc.cluster.local/health
          kubectl wait --for=condition=Ready \
            pod/health-check-${{ github.event.inputs.deployment_name }} \
            --timeout=30s --namespace ${{ env.NAMESPACE }} || true
          sleep 5
          kubectl logs health-check-${{ github.event.inputs.deployment_name }} \
            --namespace ${{ env.NAMESPACE }} || true
          kubectl delete pod health-check-${{ github.event.inputs.deployment_name }} \
            --namespace ${{ env.NAMESPACE }} --now || true
