name: Build and Deploy Model Service

on:
  push:
    branches: [main]
    paths:
      - 'model-service/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hassanfasseh/vela/model-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./model-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << CFG
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          CFG

      - name: Get kubeconfig
        run: |
          oci ce cluster create-kubeconfig --cluster-id ${{ secrets.CLUSTER_OCID }} --file "$HOME/.kube/config" --region ${{ secrets.OCI_REGION }} --token-version 2.0.0

      - name: Create/update ghcr-secret
        # GITHUB_TOKEN (used for the GHCR login/push steps above) expires
        # when this job finishes, or after 24h at the absolute latest —
        # fine for pushing an image within the same run, but baked into
        # a long-lived Secret for pods to pull with *later* (custom
        # model Jobs/Deployments are created on-demand, whenever someone
        # uploads a model, with no relationship to CI run timing) it
        # goes stale almost immediately. GHCR_PAT is a durable PAT for
        # exactly this purpose — same one CLAUDE.md's Registry section
        # documents for recreating this secret by hand.
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=HassanFasseh \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: |
          kubectl set image deployment/model-service model-service=${{ env.IMAGE }}:${{ github.sha }}
          kubectl rollout status deployment/model-service
