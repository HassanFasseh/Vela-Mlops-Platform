name: Build Base Custom Runner

# Builds custom-runner/base/ into the ONE fixed image every custom model
# deployment runs — predict.py and model_files/ are mounted in at
# runtime (ConfigMap + PVC, see backend/app/services/k8s_custom.py), not
# baked into per-deployment images the way the old custom-deploy.yml
# flow built them. Run manually after reviewing a change here; there's
# no per-upload trigger anymore since uploads no longer build anything.

on:
  # Deliberately workflow_dispatch-only, no push trigger — a base-image
  # change should be reviewed and rebuilt on purpose, not fired
  # automatically the moment something under custom-runner/base/ merges
  # to main (an earlier version of this file had a push+paths trigger
  # doing exactly that, which defeated the point).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hassanfasseh/vela/custom-runner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./custom-runner/base
          # OKE on Oracle Always Free is arm64-only.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:base
            ${{ env.IMAGE }}:base-${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << CFG
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          CFG

      - name: Get kubeconfig
        run: |
          oci ce cluster create-kubeconfig --cluster-id ${{ secrets.CLUSTER_OCID }} --file "$HOME/.kube/config" --region ${{ secrets.OCI_REGION }} --token-version 2.0.0

      - name: Point new custom deployments at this build
        # :base itself is left alone (still useful as a human-readable
        # tag to pull/inspect manually) — this is what actually makes
        # every custom model deployed from now on use the image just
        # built, by way of k8s_custom.py's RUNTIME_IMAGE reading
        # CUSTOM_RUNNER_IMAGE. Existing custom deployments are untouched;
        # they keep running whatever they were already running until
        # someone redeploys/restarts them.
        run: |
          kubectl set env deployment/backend-app CUSTOM_RUNNER_IMAGE=${{ env.IMAGE }}:base-${{ github.sha }}
