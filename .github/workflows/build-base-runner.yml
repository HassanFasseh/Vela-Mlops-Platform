name: Build Base Custom Runner

# Builds custom-runner/base/ into the ONE fixed image every custom model
# deployment runs — predict.py and model_files/ are mounted in at
# runtime (ConfigMap + PVC, see backend/app/services/k8s_custom.py), not
# baked into per-deployment images the way the old custom-deploy.yml
# flow built them. Run manually after reviewing a change here; there's
# no per-upload trigger anymore since uploads no longer build anything.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'custom-runner/base/**'
      - '.github/workflows/build-base-runner.yml'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hassanfasseh/vela/custom-runner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./custom-runner/base
          # OKE on Oracle Always Free is arm64-only.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:base
